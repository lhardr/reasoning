    // document mints the blobs for its OWN frames, obtaining page text

      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);

      // root's never-relay rule) are what hold in fully opaque chains

    // consumers read these Blobs directly. Survives the swap like the error sink.

    for (const uuid of uuids) {

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';

    // would push the parser into quirks mode. DOMParser always emits a <head>

    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).

    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;

      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');

        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });

        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];

      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;

    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

yle=\"width: 30px; height: 30px; border-radius: 999px; border: 1.5px dashed #D8D2C6; background: #FBFAF7; color: #8a8880; cursor: pointer; font-size: 16px; line-height: 1;\">+<\u002Fbutton>\n            <\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"height: 1px; background: #F0EADF;\"><\u002Fdiv>\n        <div>\n          <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px;\">\n            <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.05em; color: #8a8880; text-transform: uppercase;\">Use cases \u2014 {{ ucCount }}<\u002Fspan>\n            <button sc-camel-on-click=\"{{ onEditUcs }}\" style=\"border: 1px solid #E4DED2; background: #FBF9F5; color: #3D7E8C; font-size: 12.5px; font-weight: 500; padding: 7px 12px; border-radius: 9px; cursor: pointer;\">+ Add or edit tasks<\u002Fbutton>\n          <\u002Fdiv>\n          <div style=\"display: flex; flex-wrap: wrap; gap: 8px;\">\n            <sc-for list=\"{{ ucChips }}\" as=\"uc\" hint-placeholder-count=\"3\">\n              <div style=\"display: inline-flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; border: 1px solid #E4DED2; border-radius: 999px; background: #FBF9F5;\">\n                <button sc-camel-on-click=\"{{ uc.onJump }}\" style=\"border: none; background: none; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; padding: 0;\">\n                  <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; font-weight: 600; color: {{ uc.tagColor }};\">{{ uc.tag }}<\u002Fspan>\n                  <span style=\"font-size: 13px; color: #3A454C;\">{{ uc.title }}<\u002Fspan>\n                <\u002Fbutton>\n                <button sc-camel-on-click=\"{{ uc.onRemove }}\" style=\"border: none; background: #F5F0E8; color: #9a978f; width: 20px; height: 20px; border-radius: 999px; cursor: pointer; font-size: 13px; line-height: 1; flex: 0 0 auto;\">\u00d7<\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n            <sc-if value=\"{{ noUcsBoard }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-size: 13px; color: #a09c93; padding: 6px 2px;\">No use cases selected.<\u002Fdiv><\u002Fsc-if>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ noModels }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border: 1px dashed #E4DED2; border-radius: 14px; padding: 48px; text-align: center; color: #a09c93; font-family: 'IBM Plex Mono', monospace; font-size: 13px; margin-top: 22px;\">Open \u201cEdit selection\u201d to add models.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ noUcsBoardMain }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"border: 1px dashed #E4DED2; border-radius: 14px; padding: 48px; text-align: center; color: #a09c93; font-family: 'IBM Plex Mono', monospace; font-size: 13px; margin-top: 22px;\">Open \u201cEdit selection\u201d to add tasks.<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ hasActive }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"position: sticky; top: 59px; z-index: 30; background: rgba(20,44,49,0.92); backdrop-filter: blur(8px); padding: 12px 0 12px; margin-top: 8px; box-shadow: 0 10px 16px -14px rgba(44,58,66,0.22);\">\n          <div style=\"{{ gridStyle }}\">\n            <sc-for list=\"{{ activeBlock.cols }}\" as=\"col\" hint-placeholder-count=\"3\">\n              <div style=\"{{ col.headerStyle }}\">\n                <div>\n                  <div style=\"font-size: 15px; font-weight: 600; letter-spacing: -0.01em;\">{{ col.modelName }}<\u002Fdiv>\n                  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #a09c93; margin-top: 2px;\">{{ col.org }}<\u002Fdiv>\n                <\u002Fdiv>\n                <span style=\"{{ col.tsBadgeStyle }}\" title=\"{{ col.tsDesc }}\">{{ col.tsLabel }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"display: flex; align-items: stretch; gap: 12px; margin-top: 16px;\">\n          <button sc-camel-on-click=\"{{ onUcPrev }}\" style=\"{{ ucPrevStyle }}\" style-hover=\"transform: translateX(-4px); color: #3D7E8C; border-color: #C9DED9;\">\u2039<\u002Fbutton>\n          <div style=\"position: relative; overflow: hidden; flex: 1; min-width: 0; background: #FFFFFF; border: 1px solid #EBE5DA; border-radius: 20px; padding: 24px 28px; box-shadow: 0 10px 30px -18px rgba(44,58,66,0.2); display: flex; flex-direction: column;\">\n            <div style=\"{{ activeTaskCard.numberStyle }}\">{{ activeTaskCard.number }}<\u002Fdiv>\n            <div style=\"{{ activeTaskCard.typeStyle }}\">{{ activeTaskCard.typeLabel }}<\u002Fdiv>\n            <div style=\"font-size: 22px; font-weight: 600; letter-spacing: -0.015em; margin-top: 12px; color: #2C3A42;\">{{ activeTaskCard.title }}<\u002Fdiv>\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #a7a296; margin-top: 6px;\">{{ activeTaskCard.metaLine }}<\u002Fdiv>\n            <div class=\"scrolly\" style=\"background: #FAF8F3; border-radius: 10px; padding: 14px 16px; font-size: 14px; line-height: 1.62; color: #3A454C; white-space: pre-wrap; max-height: 150px; overflow-y: auto; margin-top: 14px;\">{{ activeTaskCard.body }}<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onUcNext }}\" style=\"{{ ucNextStyle }}\" style-hover=\"transform: translateX(4px); color: #3D7E8C; border-color: #C9DED9;\">\u203a<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"display: flex; justify-content: center; align-items: center; gap: 6px; margin-top: 12px; flex-wrap: wrap;\">\n          <sc-for list=\"{{ ucDots }}\" as=\"d\" hint-placeholder-count=\"3\">\n            <button sc-camel-on-click=\"{{ d.onClick }}\" style=\"{{ d.styleObj }}\" title=\"{{ d.title }}\"><\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 18px;\">\n          <div style=\"{{ gridStyle }}\">\n            <sc-for list=\"{{ activeBlock.cols }}\" as=\"col\" hint-placeholder-count=\"3\">\n              <div style=\"{{ col.contentCardStyle }}\">\n                <div style=\"padding: 16px 17px 14px; border-bottom: 1px solid #F0EADF;\">\n                  <div style=\"display: flex; align-items: baseline; justify-content: space-between; gap: 8px;\">\n                    <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.06em; color: #9a978f; text-transform: uppercase;\">Reasoning tokens<\u002Fspan>\n                    <sc-if value=\"{{ col.bestReas }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; font-weight: 600; color: #2A6F4F; background: #E7F2EC; padding: 2px 6px; border-radius: 5px;\">LEANEST<\u002Fspan><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 25px; font-weight: 600; color: #2C3A42; margin-top: 3px; line-height: 1;\">{{ col.reasFmt }}<\u002Fdiv>\n                  <div style=\"height: 6px; background: #F0EADF; border-radius: 4px; margin-top: 10px; overflow: hidden;\"><div style=\"{{ col.reasBarStyle }}\"><\u002Fdiv><\u002Fdiv>\n                <\u002Fdiv>\n\n                <div style=\"padding: 16px 17px; border-bottom: 1px solid #F0EADF;\">\n                  <div style=\"display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 9px;\">\n                    <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: #9a978f; text-transform: uppercase;\">Reasoning trace \u00b7 {{ col.langLabel }}<\u002Fspan>\n                    <sc-if value=\"{{ col.hasReasoning }}\" hint-placeholder-val=\"{{ true }}\"><button sc-camel-on-click=\"{{ col.onToggleExpand }}\" style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #3D7E8C; background: none; border: none; cursor: pointer; padding: 0; font-weight: 500;\">{{ col.expandLabel }}<\u002Fbutton><\u002Fsc-if>\n                  <\u002Fdiv>\n                  <sc-if value=\"{{ col.warning }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; color: #b0752e; background: #FBEFD8; padding: 6px 9px; border-radius: 7px; line-height: 1.45; margin-bottom: 9px;\">\u26a0 {{ col.warning }}<\u002Fdiv><\u002Fsc-if>\n                  <sc-if value=\"{{ col.hasReasoning }}\" hint-placeholder-val=\"{{ true }}\">\n                    <div style=\"position: relative;\">\n                      <div class=\"scrolly\" style=\"{{ col.reasPanelStyle }}\">{{ col.reasoning }}<\u002Fdiv>\n                      <sc-if value=\"{{ col.showFade }}\" hint-placeholder-val=\"{{ false }}\"><div style=\"position: absolute; left: 0; right: 0; bottom: 0; height: 46px; background: linear-gradient(to bottom, rgba(252,250,247,0), #FCFAF7); pointer-events: none; border-radius: 0 0 9px 9px;\"><\u002Fdiv><\u002Fsc-if>\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ col.noReasoning }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #a5a199; background: #F7F3EC; border: 1px dashed #E4DED2; padding: 14px; border-radius: 9px; text-align: center;\">{{ col.noReasonText }}<\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n\n                <div style=\"padding: 14px 17px; border-bottom: 1px solid #F0EADF;\">\n                  <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: #9a978f; text-transform: uppercase; margin-bottom: 8px;\">Answer<\u002Fdiv>\n                  <div class=\"scrolly\" style=\"max-height: 200px; overflow-y: auto; font-size: 13px; line-height: 1.62; color: #384249; white-space: pre-wrap; padding-right: 6px;\">{{ col.answer }}<\u002Fdiv>\n                <\u002Fdiv>\n\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"margin-top: 18px; border: 1px solid #EBE5DA; background: #FFFFFF; border-radius: 16px; overflow: hidden;\">\n          <div style=\"{{ dataHeadStyle }}\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; letter-spacing: 0.05em; color: #9a978f; text-transform: uppercase;\">Model data<\u002Fdiv>\n            <sc-for list=\"{{ activeBlock.cols }}\" as=\"col\" hint-placeholder-count=\"3\">\n              <div style=\"display: flex; align-items: center; gap: 8px; min-width: 0;\">\n                <span style=\"{{ col.dataDotStyle }}\"><\u002Fspan>\n                <span style=\"font-size: 13px; font-weight: 600; color: #2C3A42; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;\">{{ col.modelName }}<\u002Fspan>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n          <sc-for list=\"{{ dataRows }}\" as=\"row\" hint-placeholder-count=\"6\">\n            <div style=\"{{ dataRowStyle }}\">\n              <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8a8880; letter-spacing: 0.02em;\">{{ row.label }}<\u002Fdiv>\n              <sc-for list=\"{{ row.cells }}\" as=\"cell\" hint-placeholder-count=\"3\">\n                <div style=\"display: flex; align-items: center; gap: 8px;\">\n                  <span style=\"{{ cell.style }}\">{{ cell.text }}<\u002Fspan>\n                  <sc-if value=\"{{ cell.hasBadge }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 9px; font-weight: 600; color: #2A6F4F; background: #E7F2EC; padding: 2px 6px; border-radius: 5px; text-transform: uppercase;\">{{ cell.badge }}<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <\u002Fsc-if>\n\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===================== LEADERBOARD ===================== -->\n  <sc-if value=\"{{ isLeaderboard }}\" hint-placeholder-val=\"{{ false }}\">\n  <main>\n    <div style=\"max-width: 1180px; margin: 0 auto; padding: 44px 32px 4px;\">\n      <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11.5px; color: #6FB0B8; letter-spacing: 0.04em;\">BENCHMARK / LEADERBOARD<\u002Fdiv>\n      <h1 style=\"font-size: 33px; font-weight: 600; letter-spacing: -0.022em; margin: 12px 0 0; max-width: 780px; line-height: 1.13; color: #F3F7F7;\">The whole panel, ranked<\u002Fh1>\n      <p style=\"font-size: 16.5px; color: #B7C8CB; line-height: 1.62; max-width: 730px; margin: 16px 0 0;\">Twelve models across ten light tasks and three heavy ones. Sort by any metric. Correctness is near-uniform \u2014 almost every model passes every graded task \u2014 so the leaderboard ranks what actually separates them: how many tokens they burn, what that costs, and how much of the thinking is waste.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"max-width: 1180px; margin: 22px auto 0; padding: 0 32px; display: flex; gap: 10px; flex-wrap: wrap;\">\n      <button sc-camel-on-click=\"{{ onToggleGlossary }}\" style=\"{{ glossaryBtnStyle }}\">{{ glossaryBtnLabel }}<\u002Fbutton>\n      <button sc-camel-on-click=\"{{ onToggleReport }}\" style=\"{{ reportBtnStyle }}\">{{ reportBtnLabel }}<\u002Fbutton>\n    <\u002Fdiv>\n\n    <sc-if value=\"{{ showGlossary }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width: 1180px; margin: 14px auto 0; padding: 0 32px;\">\n        <div style=\"border: 1px solid #EBE5DA; background: #FFFFFF; border-radius: 16px; padding: 8px 4px;\">\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 2px 0;\">\n            <sc-for list=\"{{ glossary }}\" as=\"g\" hint-placeholder-count=\"7\">\n              <div style=\"padding: 16px 20px; border-bottom: 1px solid #F3EEE4;\">\n                <div style=\"font-size: 14px; font-weight: 600; color: #2C3A42; margin-bottom: 5px;\">{{ g.t }}<\u002Fdiv>\n                <div style=\"font-size: 13px; color: #6b7178; line-height: 1.58;\">{{ g.d }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <sc-if value=\"{{ showReport }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"max-width: 1180px; margin: 14px auto 0; padding: 0 32px;\">\n        <div style=\"border: 1px solid #E6D9C4; background: #FBF6EC; border-radius: 16px; padding: 22px 24px;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: #b0752e; text-transform: uppercase; margin-bottom: 4px;\">From the study<\u002Fdiv>\n          <div style=\"font-size: 18px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 16px;\">What the experiment found<\u002Fdiv>\n          <div style=\"display: grid; grid-template-columns: 1fr 1fr; gap: 18px 28px;\">\n            <sc-for list=\"{{ insights }}\" as=\"ins\" hint-placeholder-count=\"6\">\n              <div style=\"border-left: 2px solid #E0B76A; padding-left: 15px;\">\n                <div style=\"font-size: 14.5px; font-weight: 600; color: #2C3A42; margin-bottom: 5px;\">{{ ins.t }}<\u002Fdiv>\n                <div style=\"font-size: 13px; color: #6b6455; line-height: 1.6;\">{{ ins.d }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-if>\n\n    <div style=\"max-width: 1180px; margin: 22px auto 0; padding: 0 32px;\">\n      <div style=\"display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px;\">\n        <span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 11px; letter-spacing: 0.05em; color: #8FA6AB; text-transform: uppercase; margin-right: 4px;\">Task type<\u002Fspan>\n        <sc-for list=\"{{ filterChips }}\" as=\"f\" hint-placeholder-count=\"7\">\n          <button sc-camel-on-click=\"{{ f.onClick }}\" style=\"{{ f.styleObj }}\">{{ f.label }}<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ notLoaded }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"font-family: 'IBM Plex Mono', monospace; color: #a09c93; font-size: 13px; padding: 30px 4px;\">Loading benchmark data\u2026<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ loaded }}\" hint-placeholder-val=\"{{ false }}\">\n      <div style=\"border: 1px solid #EBE5DA; background: #FFFFFF; border-radius: 16px; overflow: hidden;\">\n        <div style=\"display: grid; grid-template-columns: 44px 1.6fr repeat(6, 1fr); align-items: center; padding: 13px 20px; border-bottom: 1px solid #EFE9DE; background: #FBF9F5;\">\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #a09c93;\">#<\u002Fdiv>\n          <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10.5px; letter-spacing: 0.04em; color: #8a8880; text-transform: uppercase;\">Model<\u002Fdiv>\n          <sc-for list=\"{{ columns }}\" as=\"c\" hint-placeholder-count=\"6\">\n            <button sc-camel-on-click=\"{{ c.onClick }}\" style=\"{{ c.headStyle }}\" title=\"{{ c.hint }}\">{{ c.label }}{{ c.arrow }}<\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <sc-for list=\"{{ rows }}\" as=\"row\" hint-placeholder-count=\"8\">\n          <div style=\"{{ row.rowStyle }}\">\n            <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: {{ row.rankColor }};\">{{ row.rank }}<\u002Fdiv>\n            <div style=\"display: flex; align-items: center; gap: 11px;\">\n              <span style=\"{{ row.dotStyle }}\"><\u002Fspan>\n              <div>\n                <div style=\"font-size: 14.5px; font-weight: 600; letter-spacing: -0.01em;\">{{ row.name }}<\u002Fdiv>\n                <div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: #a09c93; margin-top: 1px;\">{{ row.org }} \u00b7 {{ row.tsWord }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"{{ row.reasCellStyle }}\"><div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: #2C3A42;\">{{ row.reasFmt }}<\u002Fdiv><div style=\"height: 4px; background: #F0EADF; border-radius: 3px; margin-top: 5px; overflow: hidden;\"><div style=\"{{ row.reasBar }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"{{ row.outCellStyle }}\"><div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: #2C3A42;\">{{ row.outFmt }}<\u002Fdiv><div style=\"height: 4px; background: #F0EADF; border-radius: 3px; margin-top: 5px; overflow: hidden;\"><div style=\"{{ row.outBar }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"{{ row.costCellStyle }}\" title=\"{{ row.costTitle }}\"><div style=\"font-family: 'IBM Plex Mono', monospace; font-size: 13.5px; color: #2C3A42;\">{{ row.costFmt }}{{ row.costIndicativeMark }}<\u002Fdiv><div style=\"height: 4px; background: #F0EADF; border-radius: 3px; margin-top: 5px; overflow: hidden;\"><div style=\"{{ row.costBar }}\"><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n            <div style=\"{{ row.redCellStyle }}\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; font-weight: 600; color: {{ row.redColor }};\">{{ row.redFmt }}<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ row.cohCellStyle }}\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 14px; color: #3D7E8C;\">{{ row.cohFmt }}<\u002Fspan><\u002Fdiv>\n            <div style=\"{{ row.corrCellStyle }}\"><span style=\"font-family: 'IBM Plex Mono', monospace; font-size: 12.5px; color: #2A6F4F; background: #E7F2EC; padding: 3px 9px; border-radius: 6px;\">{{ row.corrFmt }}<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n      <div style=\"display: flex; gap: 22px; flex-wrap: wrap; margin-top: 14px; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #a09c93;\">\n        <span>Redundancy &amp; Coherence 1\u20135 \u00b7 lower / higher is better<\u002Fspan>\n        <span>Totals across {{ includedCount }} use case(s)<\u002Fspan>\n        <span>\u2014 = trace hidden, not scored<\u002Fspan>\n      <\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fmain>\n  <\u002Fsc-if>\n\n  <!-- ===================== MODEL PICKER OVERLAY ===================== -->\n  <sc-if value=\"{{ pickerOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ onClosePicker }}\" style=\"position: fixed; inset: 0; z-index: 100; background: rgba(24,30,33,0.42); display: flex; align-items: center; justify-content: center; padding: 24px;\">\n      <div sc-camel-on-click=\"{{ onStopProp }}\" style=\"width: 460px; max-width: 100%; max-height: 82vh; background: #FFFFFF; border-radius: 18px; box-shadow: 0 24px 60px rgba(24,30,33,0.32); display: flex; flex-direction: column; overflow: hidden;\">\n        <div style=\"display: flex; align-items: center; justify-content: space-between; padding: 18px 20px; border-bottom: 1px solid #F0EADF;\">\n          <div style=\"font-size: 16px; font-weight: 600;\">Select a model<\u002Fdiv>\n          <button sc-camel-on-click=\"{{ onClosePicker }}\" style=\"border: none; background: #F5F0E8; color: #6b7178; width: 28px; height: 28px; border-radius: 999px; cursor: pointer; font-size: 16px; line-height: 1;\">\u00d7<\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"scrolly\" style=\"overflow-y: auto; padding: 8px;\">\n          <sc-for list=\"{{ pickerModels }}\" as=\"pm\" hint-placeholder-count=\"8\">\n            <button sc-camel-on-click=\"{{ pm.onClick }}\" style=\"{{ pm.rowStyle }}\">\n              <span style=\"{{ pm.dotStyle }}\"><\u002Fspan>\n              <span style=\"flex: 1; min-width: 0; text-align: left;\">\n                <span style=\"display: block; font-size: 14px; font-weight: 600; color: #2C3A42;\">{{ pm.name }}<\u002Fspan>\n                <span style=\"display: block; font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: #8a8880; margin-top: 2px;\">{{ pm.org }} \u00b7 {{ pm.desc }}<\u002Fspan>\n              <\u002Fspan>\n              <span style=\"{{ pm.tagStyle }}\">{{ pm.stateLabel }}<\u002Fspan>\n            <\u002Fbutton>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;: {&quot;width&quot;: 1280, &quot;height&quot;: 920}, &quot;startView&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;compare&quot;, &quot;leaderboard&quot;], &quot;default&quot;: &quot;compare&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Defaults&quot;}, &quot;highlightBest&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Defaults&quot;}, &quot;showFindings&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: false, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Defaults&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    view: null,\n    loaded: false,\n    loadErr: null,\n    stage: 'w1',\n    slots: [null, null, null],\n    selPrompts: [],\n    w1idx: 0,\n    activeUc: 0,\n    pickerSlot: null,\n    ucMenuOpen: false,\n    editOpen: false,\n    highlight: null,\n    expanded: {},\n    sortKey: 'redundancy',\n    sortDir: 'asc',\n    typeFilter: 'all',\n    showGlossary: false,\n    showReport: null,\n  };\n\n  MODELS = [\n    { id: 'deepseek_v4', name: 'DeepSeek V4', o ral_language', load: 'Low' },\n    { id: 'P3', n: 3, title: 'Appeal deadline', sub: 'Administrative law, date reasoning', type: 'Legal', tkey: 'da_legal', load: 'High' },\n    { id: 'P4', n: 4, title: 'Sick-pay decision', sub: 'Administrative law, due process', type: 'Legal', tkey: 'da_legal', load: 'Very high' },\n    { id: 'P5', n: 5, title: 'Train travel time', sub: 'Two-leg arithmetic', type: 'Math', tkey: 'math', load: 'High' },\n    { id: 'P6', n: 6, title: 'Race ordering', sub: 'Constraint deduction', type: 'Logic', tkey: 'logic', load: 'High' },\n    { id: 'P7', n: 7, title: 'Text \u2192 JSON', sub: 'Schema-bound structuring', type: 'Code', tkey: 'code_structure', load: 'Medium' },\n    { id: 'P8', n: 8, title: 'Python bug fix', sub: 'Find & fix the defect', type: 'Code', tkey: 'code_bug', load: 'High' },\n    { id: 'P9', n: 9, title: 'Self-host an open LLM?', sub: 'Open pros-and-cons analysis', type: 'Open analysis', tkey: 'da_open_analysis', load: 'High' },\n    { id: 'P10', n: 10, title: 'Which AI initiative?', sub: 'Open trade-off analysis', type: 'Open analysis', tkey: 'da_open_analysis', load: 'High' },\n    { id: 'H1', n: 11, title: 'Largest prime \u2192 digit sum', sub: 'HumanEval/94 \u00b7 no tools', type: 'Heavy code', tkey: 'code', load: 'Very high', suite: 'heavy' },\n    { id: 'H1T', n: 12, title: 'Largest prime \u2192 digit sum', sub: 'HumanEval/94 \u00b7 tools offered', type: 'Heavy code', tkey: 'code', load: 'Very high', suite: 'heavy' },\n    { id: 'H2', n: 13, title: '5-year return difference', sub: 'Cadence vs NASDAQ \u00b7 no tools', type: 'Heavy finance', tkey: 'finance_calc', load: 'High', suite: 'heavy' },\n    { id: 'H2T', n: 14, title: '5-year return difference', sub: 'Cadence vs NASDAQ \u00b7 tools offered', type: 'Heavy finance', tkey: 'finance_calc', load: 'High', suite: 'heavy' },\n    { id: 'H3', n: 15, title: 'Total return on $100,000', sub: 'S&P 500 graph \u00b7 no tools', type: 'Heavy finance', tkey: 'finance_interp', load: 'High', suite: 'heavy' },\n    { id: 'H3T', n: 16, title: 'Total return on $100,000', sub: 'S&P 500 graph \u00b7 tools offered', type: 'Heavy finance', tkey: 'finance_interp', load: 'High', suite: 'heavy' },\n  ];\n\n  TYPEC = {\n    'Natural language': { c: '#3D7E8C', bg: '#EAF2F3' },\n    'Legal': { c: '#b0562e', bg: '#FBE7DD' },\n    'Math': { c: '#b0752e', bg: '#FBEFD8' },\n    'Logic': { c: '#3D7E8C', bg: '#EAF2F3' },\n    'Code': { c: '#5a6a72', bg: '#EEF0F1' },\n    'Open analysis': { c: '#b0562e', bg: '#FBE7DD' },\n    'Heavy code': { c: '#2C3A42', bg: '#E4E8EA' },\n    'Heavy finance': { c: '#8a6d3b', bg: '#F5EDDC' },\n  };\n\n  NUMCOLORS = [\n    'rgba(61,126,140,0.20)',\n    'rgba(114,189,197,0.28)',\n    'rgba(78,147,160,0.22)',\n    'rgba(212,149,42,0.26)',\n    'rgba(224,122,84,0.26)',\n    'rgba(232,105,74,0.24)',\n    'rgba(240,160,138,0.32)',\n    'rgba(192,112,90,0.26)',\n    'rgba(90,106,114,0.24)',\n    'rgba(44,58,66,0.20)',\n  ];\n\n  TYPEC2 = {\n    'Natural language': { c: '#3D7E8C', bg: '#E7F1F1' },\n    'Legal': { c: '#BE6A43', bg: '#FBEADF' },\n    'Math': { c: '#AE7B1E', bg: '#FAF0D6' },\n    'Logic': { c: '#4E93A0', bg: '#E6F1F2' },\n    'Code': { c: '#4A5860', bg: '#ECEEF0' },\n    'Open analysis': { c: '#C0705A', bg: '#FBEAE3' },\n    'Heavy code': { c: '#3A454C', bg: '#E6EAEC' },\n    'Heavy finance': { c: '#96773F', bg: '#F6EFE0' },\n  };\n\n  TS = {\n    raw: { label: 'Raw', word: 'raw', desc: 'Full thinking is visible', c: '#2A6F4F', bg: '#E7F2EC' },\n    raw_anchor: { label: 'Raw \u00b7 anchor', word: 'raw', desc: 'English reference trace (Gemma)', c: '#2A6F4F', bg: '#E7F2EC' },\n    summarized: { label: 'Summarized', word: 'summarized', desc: \"Provider's summary of the chain of thought \u2014 not the raw trace\", c: '#b0752e', bg: '#FBEFD8' },\n    count_only: { label: 'Count only', word: 'count-only', desc: 'Token count exposed, reasoning text hidden', c: '#b0562e', bg: '#FBE7DD' },\n    absent: { label: 'Hidden', word: 'hidden', desc: 'No reasoning text exposed', c: '#9A3B3B', bg: '#F6E0DE' },\n  };\n\n  GLOSSARY = [\n    { t: 'Reasoning tokens', d: 'Tokens the model spends thinking before it answers \u2014 hidden work you still pay for. On raw-trace models this is visible text; on others only the count is exposed.' },\n    { t: 'Input / Output tokens', d: 'Input is the prompt; output is the visible answer. Reasoning tokens are billed on top of both.' },\n    { t: 'Cost', d: \"The call's total price at each provider's per-token rate, summing input, reasoning and output.\" },\n    { t: 'Redundancy \u2014 1 to 5, lower is better', d: 'How much of the trace is wasted motion \u2014 re-deciding, circling, meta-filler \u2014 rather than progress. Scored by two independent judges (MiniMax and Gemini 3.1 Pro) against a fixed rubric.' },\n    { t: 'Coherence \u2014 1 to 5, higher is better', d: 'How well the trace holds together as a logical sequence. Reported as uniformly high, so it separates the models less than redundancy does.' },\n    { t: 'Trace status', d: 'Raw = full thinking visible. Summarized = the provider\\u2019s summary of the chain of thought. Count-only = token count exposed but text hidden. Hidden = no reasoning text at all.' },\n    { t: 'Correctness', d: 'Graded blind against a withheld answer key on the six factual tasks (math, logic, JSON, legal, code). Every model passed \u2014 48 of 48 verdicts.' },\n  ];\n\n  INSIGHTS = [\n    { t: \"Correctness doesn't separate them\", d: 'All eight models answered every graded task correctly \u2014 48 of 48 verdicts. On these tasks the question isn\\u2019t whether a model can reach the answer, but what it costs to get there.' },\n    { t: 'Reasoning is the main expense', d: 'For models with visible traces, thinking is roughly two-thirds to four-fifths of all tokens. The cost lives in the reasoning, not the final answer.' },\n    { t: 'More reasoning tokens \\u2260 more thinking', d: 'Much of the spread is waste, not thoroughness. GLM reasons tightly; Kimi and Mistral circle, re-decide and pad with meta-commentary while reaching the same correct answer.' },\n    { t: 'No one thinks in Chinese', d: 'None of the three Chinese models reason primarily in Chinese. They think in English or in the prompt\\u2019s language; Chinese appears only as leakage. The more symbolic the task, the more they revert to an English substrate.' },\n    { t: 'Volume follows task type, not the label', d: 'A legal deadline calculation and an arithmetic problem are both marked high-load, yet cost wildly different amounts. Symbolic single-path tasks are cheap; open and legal tasks are expensive.' },\n    { t: 'A correct answer can hide a false premise', d: 'On the appeal-deadline task, DeepSeek spent 2,405 reasoning tokens and knew 3 April 2026 is Good Friday. Sonnet reached the same verdict far cheaper \u2014 but explicitly claimed the day was neither weekend nor holiday. Both scored correct, because the check grades the landing, not the path.' },\n  ];\n\n  componentDidMount() {\n    fetch((window.__resources && window.__resources.reasoningData) || 'data/reasoning-data.json')\n      .then(r => r.json())\n      .then(d => {\n        this.byKey = {};\n        this.ptext = {};\n        d.cells.forEach(c => { this.byKey[c.model + '|' + c.prompt] = c; });\n        (d.prompts || []).forEach(p => { this.ptext[p.id] = p.text; });\n        this.setState({ loaded: true });\n      })\n      .catch(e => this.setState({ loadErr: String((e && e.message) || e) }));\n  }\n\n  cell(m, p) { return (this.byKey && this.byKey[m + '|' + p]) || null; }\n  avgRed(c) { if (!c || !c.judges || !c.judges.length) return null; const v = c.judges.map(j => j.redundancy).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; }\n  avgCoh(c) { if (!c || !c.judges || !c.judges.length) return null; const v = c.judges.map(j => j.coherence).filter(x => x != null); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; Tok || 0), 0);\n      // Prefer the real sum of all runs (costSumActual, heavy cells) over the\n      // single median-cost estimate. A light cell (n=1) has no costSumActual\n      // but its median IS the exact cost - that fallback isn't an estimate.\n      // Only mark the row indicative when a cell with n>1 actually lacks a\n      // real sum to fall back to.\n      let costIndicative = false;\n      const costSum = cs.reduce((a, c) => {\n        if (c.costSumActual != null) return a + c.costSumActual;\n        if ((c.n || 1) > 1) costIndicative = true;\n        return a + (c.cost || 0);\n      }, 0);\n      const redJ = cs.flatMap(c => (c.judges || []).map(j => j.redundancy)).filter(x => x != null);\n      const cohJ = cs.flatMap(c => (c.judges || []).map(j => j.coherence)).filter(x => x != null);\n      const avgRed = redJ.length ? redJ.reduce((a, b) => a + b, 0) / redJ.length : null;\n      const avgCoh = cohJ.length ? cohJ.reduce((a, b) => a + b, 0) / cohJ.length : null;\n      const graded = cs.filter(c => c.correct != null);\n      const corr = graded.reduce((a, c) => a + (c.correctN != null ? c.correctN : (c.correct ? 1 : 0)), 0);\n      const gradedN = graded.reduce((a, c) => a + (c.correctN != null ? c.n : 1), 0);\n      const anyTs = cs.length ? this.TS[cs[0].regime === 'raw_anchor' ? 'raw_anchor' : cs[0].ts] : null;\n      return { m, reasSum, outSum, costSum, avgRed, avgCoh, corr, costIndicative, gradedTotal: gradedN, tsWord: anyTs ? anyTs.word : '\\u2014' };\n    });\n\n    const maxReasL = Math.max(1, ...rows0.map(r => r.reasSum));\n    const maxOutL = Math.max(1, ...rows0.map(r => r.outSum));\n    const maxCostL = Math.max(1e-9, ...rows0.map(r => r.costSum));\n\n    const sk = s.sortKey, dir = s.sortDir;\n    const val = (r) => ({ reasSum: r.reasSum, outSum: r.outSum, costSum: r.costSum, redundancy: r.avgRed, coherence: r.avgCoh, correct: r.gradedTotal ? r.corr / r.gradedTotal : 0 })[sk];\n    rows0.sort((a, b) => {\n      let va = val(a), vb = val(b);\n      const na = va == null, nb = vb == null;\n      if (na && nb) return 0;\n      if (na) return 1;\n      if (nb) return -1;\n      return dir === 'asc' ? va - vb : vb - va;\n    });\n\n    const rows = rows0.map((r, i) => {\n      const redColor = r.avgRed == null ? '#9a978f' : (r.avgRed <= 1.9 ? '#2A6F4F' : (r.avgRed >= 2.8 ? '#b0562e' : '#3A454C'));\n      const cellPad = { padding: '0 8px' };\n      const hi = (key) => sk === key ? { ...cellPad, background: '#FBF8F1', borderRadius: '8px', padding: '8px' } : cellPad;\n      return {\n        rank: i + 1, rankColor: i === 0 ? '#3D7E8C' : '#b3afa5',\n        name: r.m.name, org: r.m.org, tsWord: r.tsWord,\n        dotStyle: { width: '10px', height: '10px', borderRadius: '999px', background: r.m.dot, flex: '0 0 auto' },\n        rowStyle: { display: 'grid', gridTemplateColumns: '44px 1.6fr repeat(6, 1fr)', alignItems: 'center', padding: '14px 20px', borderBottom: i === rows0.length - 1 ? 'none' : '1px solid #F3EEE4', background: i === 0 ? '#FCFBF8' : '#FFFFFF' },\n        reasFmt: this.fmtInt(r.reasSum), outFmt: this.fmtInt(r.outSum), costFmt: this.fmtCost(r.costSum),\n        costIndicativeMark: r.costIndicative ? ' ~' : '',\n        costTitle: r.costIndicative ? 'indicative - includes at least one multi-run cell with no recorded per-pass cost sum; falling back to median x 1' : 'sum of actual per-run cost across all included cells',\n        redFmt: r.avgRed == null ? '\\u2014' : r.avgRed.toFixed(2), cohFmt: r.avgCoh == null ? '\\u2014' : r.avgCoh.toFixed(2), redColor,\n        corrFmt: r.gradedTotal ? (r.corr + '/' + r.gradedTotal) : '\\u2014',\n        reasBar: { width: Math.round(r.reasSum / maxReasL * 100) + '%', height: '100%', background: '#72BDC5', borderRadius: '3px' },\n        outBar: { width: Math.round(r.outSum / maxOutL * 100) + '%', height: '100%', background: '#E0C58A', borderRadius: '3px' },\n        costBar: { width: Math.round(r.costSum / maxCostL * 100) + '%', height: '100%', background: '#F0A08A', borderRadius: '3px' },\n        reasCellStyle: hi('reasSum'), outCellStyle: hi('outSum'), costCellStyle: hi('costSum'),\n        redCellStyle: hi('redundancy'), cohCellStyle: hi('coherence'), corrCellStyle: hi('correct'),\n      };\n    });\n\n    const colDefs = [\n      { key: 'reasSum', label: 'Reasoning', hint: 'Total reasoning tokens \u2014 lower is leaner' },\n      { key: 'outSum', label: 'Output', hint: 'Total output tokens' },\n      { key: 'costSum', label: 'Cost', hint: 'Total cost \u2014 lower is cheaper' },\n      { key: 'redundancy', label: 'Redundancy', hint: '1\u20135, lower is better' },\n      { key: 'coherence', label: 'Coherence', hint: '1\u20135, higher is better' },\n      { key: 'correct', label: 'Correct', hint: 'Graded tasks passed' },\n    ];\n    const headBase = { border: 'none', background: 'none', cursor: 'pointer', textAlign: 'left', padding: 0, fontFamily: \"'IBM Plex Mono', monospace\", fontSize: '10.5px', letterSpacing: '0.04em', textTransform: 'uppercase' };\n    const columns = colDefs.map(c => ({\n      key: c.key, label: c.label, hint: c.hint, onClick: () => this.setSort(c.key),\n      arrow: sk === c.key ? (dir === 'asc' ? ' \\u2191' : ' \\u2193') : '',\n      headStyle: { ...headBase, color: sk === c.key ? '#3D7E8C' : '#8a8880', fontWeight: sk === c.key ? 600 : 500 },\n    }));\n\n    const outlineBtn = (on) => ({ fontFamily: \"'Helvetica Neue', Helvetica, Arial, sans-serif\", fontSize: '13px', fontWeight: 500, padding: '9px 15px', borderRadius: '10px', cursor: 'pointer', border: '1px solid ' + (on ? '#3D7E8C' : '#E4DED2'), background: on ? '#EAF2F3' : '#FFFFFF', color: on ? '#2c5a66' : '#6b7178', transition: 'all .12s' });\n\n    return {\n      panelSummary: this.MODELS.length + ' models \u00b7 ' + this.PROMPTS.length + ' tasks',\n      isCompare: compareTab, isLeaderboard: !compareTab,\n      onCompare: () => this.setState({ view: 'compare' }), onLeaderboard: () => this.setState({ view: 'leaderboard' }),\n      compareTabStyle: compareTab ? tabOn : tabOff, leaderTabStyle: compareTab ? tabOff : tabOn,\n      loaded, notLoaded: !loaded && !s.loadErr,\n      stageW1: s.stage === 'w1', stageW2: s.stage === 'w2', stageApp: s.stage === 'app',\n\n      // wizard step 1\n      w1Cards, w1TrackStyle, w1Dots, selectedCards,\n      w1SelCount: s.selPrompts.length, w1NoSelection: !w1Has,\n      onW1Prev: () => this.w1Prev(), onW1Next: () => this.w1Next(),\n      w1PrevStyle: arrowBig(s.w1idx === 0), w1NextArrowStyle: arrowBig(s.w1idx === this.PROMPTS.length - 1),\n      onGoStep2: () => this.goStep2(), continueBtnStyle,\n\n      // wizard step 2\n      modelSlots, quickSets, canAddSlot: s.slots.length < 4, onAddSlot: () => this.addSlot(),\n      onBackStep1: () => this.backStep1(), onFinishWizard: () => this.finishWizard(), compareBtnStyle,\n      w2Hint: filled.length < 2 ? 'Pick at least 2 models' : (filled.length + ' models ready'),\n\n      // board\n      editOpen: s.editOpen, onToggleEdit: () => this.setState(st => ({ editOpen: !st.editOpen })),\n      editBtnStyle: { border: '1px solid ' + (s.editOpen ? '#3D7E8C' : '#E4DED2'), background: s.editOpen ? '#EAF2F3' : '#FFFFFF', color: s.editOpen ? '#2c5a66' : '#6b7178', fontFamily: \"'IBM Plex Mono', monospace\", fontSize: '12px', padding: '9px 15px', borderRadius: '10px', cursor: 'pointer' },\n      editBtnLabel: s.editOpen ? '\u2715 Close editor' : '\u270e Edit selection',\n      onToggleHighlight: () => this.setState({ highlight: !highlight }),\n      hlTrackStyle: { width: '36px', height: '21px', borderRadius: '999px', background: highlight ? '#3D7E8C' : '#DDD6C9', position: 'relative', transition: 'background .15s', flex: '0 0 auto' },\n      hlKnobStyle: { position: 'absolute', top: '2px', left: highlight ? '17px' : '2px', width: '17px', height: '17px', borderRadius: '999px', background: '#FFFFFF', transition: 'left .15s', boxShadow: '0 1px 2px rgba(0,0,0,0.2)' },\n      ucChips, ucCount: ordered.length, ucDots,\n      ucPosLabel: ordered.length ? ((activeUc + 1) + ' / ' + ordered.length) : '',\n      onUcPrev: () => this.ucPrev(), onUcNext: () => this.ucNext(),\n      ucPrevStyle: arrowBig(activeUc === 0 || ordered.length === 0), ucNextStyle: arrowBig(activeUc >= ordered.length - 1 || ordered.length === 0),\n      onEditUcs: () => this.setState({ stage: 'w1' }),\n      gridStyle, activeTaskCard, dataRows, dataHeadStyle, dataRowStyle,\n      hasActive, activeBlock,\n      noModels: s.stage === 'app' && filled.length === 0,\n      noUcsBoard: ordered.length === 0,\n      noUcsBoardMain: s.stage === 'app' && filled.length > 0 && ordered.length === 0,\n\n      // picker\n      pickerOpen, pickerModels, onClosePicker: () => this.closePicker(), onStopProp: (e) => { if (e && e.stopPropagation) e.stopPropagation(); },\n\n      // leaderboard\n      filterChips, columns, rows, includedCount: includedPrompts.length,\n      glossary: this.GLOSSARY, insights: this.INSIGHTS,\n      showGlossary: s.showGlossary, showReport,\n      onToggleGlossary: () => this.setState({ showGlossary: !s.showGlossary }),\n      onToggleReport: () => this.setState({ showReport: !showReport }),\n      glossaryBtnStyle: outlineBtn(s.showGlossary), glossaryBtnLabel: (s.showGlossary ? 'Hide' : 'Show') + ' terminology',\n      reportBtnStyle: outlineBtn(showReport), reportBtnLabel: (showReport ? 'Hide' : 'Show') + ' study findings',\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"</script>
